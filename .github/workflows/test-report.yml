name: Test Report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-report:
    name: Post Test Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false

      - name: Run all tests and collect results
        id: tests
        run: |
          REPORT=""
          TOTAL=0
          PASSED=0
          FAILED=0

          # Test 1: Format check
          TOTAL=$((TOTAL + 1))
          if terraform fmt -check -recursive > /dev/null 2>&1; then
            REPORT="${REPORT}| Terraform Format | :white_check_mark: Pass |\n"
            PASSED=$((PASSED + 1))
          else
            REPORT="${REPORT}| Terraform Format | :x: Fail |\n"
            FAILED=$((FAILED + 1))
          fi

          # Test 2: Init
          terraform init -backend=false > /dev/null 2>&1

          # Test 3: Validate
          TOTAL=$((TOTAL + 1))
          if terraform validate > /dev/null 2>&1; then
            REPORT="${REPORT}| Terraform Validate | :white_check_mark: Pass |\n"
            PASSED=$((PASSED + 1))
          else
            REPORT="${REPORT}| Terraform Validate | :x: Fail |\n"
            FAILED=$((FAILED + 1))
          fi

          # Test 4: Convention checks
          TOTAL=$((TOTAL + 1))
          if ./scripts/validate-conventions.sh > /dev/null 2>&1; then
            REPORT="${REPORT}| Convention Checks | :white_check_mark: Pass |\n"
            PASSED=$((PASSED + 1))
          else
            REPORT="${REPORT}| Convention Checks | :x: Fail |\n"
            FAILED=$((FAILED + 1))
          fi

          echo "report<<ENDOFREPORT" >> "$GITHUB_OUTPUT"
          echo -e "$REPORT" >> "$GITHUB_OUTPUT"
          echo "ENDOFREPORT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Post summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            const total = '${{ steps.tests.outputs.total }}';
            const passed = '${{ steps.tests.outputs.passed }}';
            const failed = '${{ steps.tests.outputs.failed }}';
            const report = `${{ steps.tests.outputs.report }}`;
            const status = failed === '0' ? ':white_check_mark: All tests passed' : ':x: Some tests failed';

            const body = `## Infrastructure Test Report

            ${status} — **${passed}/${total}** checks passed

            | Test | Result |
            |------|--------|
            ${report}

            ---
            *Generated by the Infrastructure Test Report workflow*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });