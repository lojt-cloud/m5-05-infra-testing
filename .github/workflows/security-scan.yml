name: Security Scan

on:
  pull_request:
    branches: [main]

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false
          skip_check: CKV_AWS_18,CKV_AWS_119,CKV_AWS_144,CKV2_AWS_62,CKV2_AWS_61

      - name: Upload Checkov results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: results.sarif
          retention-days: 5